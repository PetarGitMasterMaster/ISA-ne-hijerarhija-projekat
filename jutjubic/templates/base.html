<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}JutJubic{% endblock %}</title>
</head>
<body>

<nav>
    <a href="{% url 'videos:list' %}">Home</a>

    {% if user.is_authenticated %}
        <span>Logged in as {{ user.username }}</span>
        |
        <a href="{% url 'videos:create' %}">Upload</a>
        |
        <a href="{% url 'logout' %}">Logout</a>
    {% else %}
        <a href="{% url 'login' %}">Login</a>
    {% endif %}
</nav>

<hr>

{% block content %}
{% endblock %}

</body>
</html>
